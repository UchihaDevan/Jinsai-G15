# Definição das Tarefas do Jinsai-G15 v2.2

plan_task:
  description: >
    Analise o pedido do usuário: "{user_prompt}".
    
    Contexto relevante extraído do projeto pelo RAG Local:
    {rag_context}
    
    Elabore um plano arquitetural enxuto contendo:
    1. Resumo das mudanças necessárias.
    2. Lista exata de arquivos a criar, modificar ou refatorar.
    3. Especificação atômica das funções, classes ou estruturas de dados a serem implementadas.
    4. Critérios de validação e testes recomendados.
  expected_output: >
    Um documento de especificação técnica conciso, em formato Markdown, pronto para guiar o Desenvolvedor Local.

implement_task:
  description: >
    Com base no plano elaborado pelo Arquiteto:
    Execute o seguinte plano de arquitetura:
    {architecture_plan}

    Contexto da base de código:
    {rag_context}

    Regras Operacionais:
    1. Nunca retorne código textual como resposta. Você DEVE usar a ferramenta `apply_patch` ou `create_file` para modificar o projeto.
    2. Antes de alterar um arquivo existente, você DEVE usar a ferramenta `read_file` para ler o conteúdo exato.
    3. Para usar `apply_patch`, o `target_content` deve ser uma correspondência exata do texto atual.
    4. Teste ou analise seu patch mentalmente antes de aplicar.
    5. Finalize a tarefa apenas após confirmar que a ferramenta reportou sucesso.

  expected_output: >
    Um resumo das alterações realizadas nos arquivos via tools, detalhando quais arquivos foram modificados e como.
